<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Uploadings Report</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50/50 m-0 p-0 min-h-screen flex flex-col text-slate-800 selection:bg-blue-100 selection:text-blue-900">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-lg border-b border-slate-200 shadow-sm shrink-0">
        <div class="px-3 py-3 flex flex-col gap-3 max-w-[1600px] mx-auto w-full sm:px-6 sm:py-4 sm:gap-4">
            
            <!-- Top Row: Brand & Actions -->
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <!-- Logo -->
                <div class="flex min-w-0 items-center gap-2 sm:gap-3">
                    <img src="logo.png" alt="Logo" class="h-9 w-9 shrink-0 object-contain rounded-lg sm:h-10 sm:w-10">
                    <h1 class="min-w-0 text-base leading-tight font-black tracking-tight text-slate-900 sm:text-xl">Creative Uploadings Report</h1>
                </div>

                <!-- Right Side: Actions -->
                <div class="flex w-full items-center justify-between gap-2 sm:w-auto sm:justify-end sm:gap-4">
                    <!-- Status Badge -->
                    <div id="status-badge" class="flex min-w-0 items-center gap-2 bg-slate-100 text-slate-500 px-2 py-1.5 rounded-lg text-[10px] font-bold tracking-wide transition-colors sm:px-3 sm:text-xs">
                        <i class="fa-solid fa-circle text-[8px]" id="status-icon"></i>
                        <span id="status-text" class="min-w-0 truncate">Standby</span>
                    </div>

                    <button type="button" id="notification-btn" onclick="enableDesktopNotifications()" class="flex shrink-0 items-center gap-2 rounded-xl border border-blue-200 bg-blue-50 px-3 py-2.5 text-xs font-bold text-blue-700 transition-colors hover:bg-blue-100" title="Enable desktop notifications">
                        <i class="fa-regular fa-bell" id="notification-icon"></i>
                        <span id="notification-btn-text">Enable Alerts</span>
                    </button>
    
                    <!-- Main Sync Button -->
                    <button onclick="fetchData()" id="sync-btn" class="flex shrink-0 items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-3 py-2.5 rounded-xl text-xs font-bold transition-all shadow-xl shadow-slate-900/10 sm:px-6 sm:text-sm hover:-translate-y-0.5 active:translate-y-0 active:shadow-md">
                        <i class="fa-solid fa-bolt" id="sync-icon"></i>
                        <span id="sync-text">Sync Now</span>
                    </button>
                </div>
            </div>

            <!-- Bottom Row: Toolbar (Filters) -->
            <div class="flex flex-col items-stretch gap-3 bg-slate-50/70 p-2 rounded-2xl border border-slate-100 sm:flex-row sm:flex-wrap sm:items-center sm:gap-4">
                
                <!-- Date Range Picker -->
                <div id="date-range-filter" class="grid w-full grid-cols-[1fr_auto_1fr] items-center gap-1 bg-white border border-slate-200 rounded-xl px-2 py-2 transition-colors focus-within:border-blue-300 focus-within:ring-4 focus-within:ring-blue-50 sm:flex sm:w-auto sm:gap-2 sm:py-1.5">
                    <label class="col-span-3 text-[10px] font-extrabold text-slate-400 uppercase tracking-widest sm:col-span-1 sm:pl-2 sm:mr-1">Range</label>
                    <input type="date" id="start-date" class="min-w-0 w-full bg-transparent border-none p-1 text-sm font-semibold text-slate-700 focus:outline-none cursor-pointer sm:w-[125px]" onchange="handleDateRangeChange()">
                    <span class="text-center text-slate-300 text-xs font-bold px-1">TO</span>
                    <input type="date" id="end-date" class="min-w-0 w-full bg-transparent border-none p-1 text-sm font-semibold text-slate-700 focus:outline-none cursor-pointer sm:w-[125px]" onchange="handleDateRangeChange()">
                </div>

                <!-- ET Filter Box (Respects Date) -->
                <div class="flex w-full min-w-0 items-center gap-3 bg-white border border-slate-200 rounded-xl px-4 py-2.5 transition-all focus-within:border-blue-300 focus-within:ring-4 focus-within:ring-blue-50 sm:max-w-sm sm:flex-1">
                    <i class="fa-solid fa-filter text-slate-400 text-sm"></i>
                    <input type="text" id="search-et" list="et-suggestions" placeholder="Filter ETs..." class="bg-transparent border-none p-0 text-sm font-medium text-slate-700 placeholder-slate-400 focus:outline-none w-full" onkeyup="renderTable()" onchange="renderTable()">
                    <datalist id="et-suggestions"></datalist>
                </div>

                <!-- Global Creative Finder (all time unless a date range is applied) -->
                <div id="global-creative-finder" class="relative flex w-full min-w-0 flex-col items-stretch gap-2 bg-purple-50 border border-purple-200 rounded-xl px-4 py-2.5 transition-all focus-within:border-purple-400 focus-within:ring-4 focus-within:ring-purple-100 sm:max-w-md sm:flex-1 sm:ml-auto">
                    <div class="flex min-w-0 items-center gap-3">
                        <i class="fa-solid fa-magnifying-glass-location text-purple-400 text-sm"></i>
                        <input type="text" id="creative-finder" role="combobox" aria-autocomplete="list" aria-controls="creative-suggestions-panel" aria-expanded="false" placeholder="Global Creative Finder..." class="min-w-0 bg-transparent border-none p-0 text-sm font-medium text-purple-900 placeholder-purple-400 focus:outline-none w-full" oninput="handleCreativeFinderInput()" onkeydown="if (event.key === 'Escape') closeCreativeSuggestions()">
                    </div>
                    <label class="flex cursor-pointer items-center gap-2 text-[11px] font-semibold text-purple-700">
                        <input type="checkbox" id="creative-finder-date-range" class="accent-purple-700" onchange="renderTable()">
                        Apply date range
                    </label>
                    <div id="creative-finder-results" class="hidden absolute left-0 right-0 top-full z-50 mt-2 max-h-80 overflow-y-auto rounded-xl border border-purple-200 bg-white p-2 shadow-xl">
                        <div id="creative-suggestions-panel" role="listbox" class="hidden max-h-48 overflow-y-auto"></div>
                        <div id="creative-version-filters" aria-label="Creative version filters" class="hidden max-h-28 flex-wrap items-center gap-2 overflow-y-auto border-t border-purple-100 pt-2"></div>
                    </div>
                </div>

            </div>

        </div>
    </header>

    <!-- Main Content Area -->
    <main class="min-w-0 p-3 max-w-[1600px] mx-auto w-full flex-grow flex flex-col gap-4 pb-16 sm:p-8 sm:gap-8">
        
        <!-- Summary Stats Grid -->
        <div class="grid grid-cols-1 gap-4 shrink-0 sm:grid-cols-2 sm:gap-8">
            <!-- Done Card -->
            <div class="min-w-0 bg-white rounded-2xl p-5 border border-slate-100 shadow-2xl shadow-slate-200/30 relative overflow-hidden group hover:border-emerald-100 transition-colors flex flex-col sm:rounded-3xl sm:p-8">
                <div class="absolute -top-6 -right-6 p-8 opacity-5 group-hover:scale-110 group-hover:rotate-12 transition-transform duration-500 ease-out pointer-events-none">
                    <i class="fa-solid fa-check-double text-9xl text-emerald-600"></i>
                </div>
                <div class="relative z-10 flex min-w-0 items-center justify-between gap-3 mb-4">
                    <div>
                        <p class="text-xs font-bold text-emerald-500 mb-2 uppercase tracking-widest">Done Creatives</p>

                        <h2 class="text-5xl font-black text-slate-800 tracking-tighter sm:text-6xl" id="count-done">0</h2>
                    </div>
                    <div class="h-12 w-12 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-500 shadow-lg shadow-emerald-200 flex items-center justify-center text-white shrink-0 sm:h-16 sm:w-16">
                        <i class="fa-solid fa-check text-2xl"></i>
                    </div>
                </div>
                
                <!-- Done ETs Badge List -->
                <div class="relative z-10 mt-auto pt-4 border-t border-slate-100 hidden" id="done-et-container">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-2">
                        Completed ETs 
                    </p>
                    <div id="done-et-list" class="flex flex-wrap gap-2 max-h-28 overflow-y-auto pr-2">
                        <!-- JS will populate done ET badges here -->
                    </div>
                </div>
            </div>
            
            <!-- Pending Card -->
            <div class="min-w-0 bg-white rounded-2xl p-5 border border-slate-100 shadow-2xl shadow-slate-200/30 relative overflow-hidden group hover:border-amber-100 transition-colors flex flex-col sm:rounded-3xl sm:p-8">
                <div class="absolute -top-6 -right-6 p-8 opacity-5 group-hover:scale-110 group-hover:-rotate-12 transition-transform duration-500 ease-out pointer-events-none">
                    <i class="fa-solid fa-hourglass-half text-9xl text-amber-600"></i>
                </div>
                <div class="relative z-10 flex min-w-0 items-center justify-between gap-3 mb-4">
                    <div>
                        <p class="text-xs font-bold text-amber-500 mb-2 uppercase tracking-widest">Pending Creatives</p>
                        <h2 class="text-5xl font-black text-slate-800 tracking-tighter sm:text-6xl" id="count-pending">0</h2>
                    </div>
                    <div class="h-12 w-12 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 shadow-lg shadow-amber-200 flex items-center justify-center text-white shrink-0 sm:h-16 sm:w-16">
                        <i class="fa-solid fa-clock text-2xl"></i>
                    </div>
                </div>
                
                <!-- Pending ETs Badge List -->
                <div class="relative z-10 mt-auto pt-4 border-t border-slate-100 hidden" id="pending-et-container">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">ETs Needing Work:</p>
                    <div id="pending-et-list" class="flex flex-wrap gap-2 max-h-28 overflow-y-auto pr-2">
                        <!-- Badges injected by JS -->
                    </div>
                </div>
            </div>
        </div>

        <div id="global-search-summary" style="display: none;" class="items-center justify-between gap-3 rounded-xl border border-purple-100 bg-purple-50 px-4 py-3 text-sm text-purple-900">
            <span id="global-search-count" aria-live="polite"></span>
            <button type="button" id="global-search-more" onclick="showMoreGlobalSearchResults()" class="shrink-0 rounded-lg bg-white px-3 py-2 text-xs font-bold text-purple-800 border border-purple-200 hover:bg-purple-100">Show more</button>
        </div>

        <!-- Data Table Container -->
        <div class="min-w-0 bg-white rounded-2xl shadow-2xl shadow-slate-200/40 border border-slate-100 overflow-hidden relative sm:rounded-3xl">
            
            <!-- Table Header Background -->
            <div class="absolute top-0 left-0 right-0 h-[60px] bg-slate-50 border-b border-slate-200 z-10"></div>
            
            <div class="overflow-x-auto z-20 relative">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead class="bg-slate-50 shadow-sm">
                        <tr>
                            <th class="py-5 px-8 font-extrabold text-xs uppercase tracking-widest text-slate-400 w-1/4">ET Name (Tab)</th>
                            <th class="py-5 px-8 font-extrabold text-xs uppercase tracking-widest text-slate-400 w-1/2">Creative</th>
                            <th class="py-5 px-8 font-extrabold text-xs uppercase tracking-widest text-slate-400 w-1/6">Date</th>
                            <th class="py-5 px-8 font-extrabold text-xs uppercase tracking-widest text-slate-400 w-1/6 text-right">Status</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="text-sm divide-y divide-slate-100/80 bg-white">
                        <tr>
                            <td colspan="4" class="py-32 text-center text-slate-400">
                                <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-slate-50 mb-6 shadow-inner border border-slate-100">
                                    <i class="fa-solid fa-wand-magic-sparkles text-3xl text-slate-300"></i>
                                </div>
                                <h3 class="text-xl font-bold text-slate-700 tracking-tight">Ready to fetch creatives</h3>
                                <p class="text-sm mt-2 text-slate-500 font-medium">Select a date above and click "Sync Now" to begin.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="versions-modal" class="fixed inset-0 z-[70] hidden items-center justify-center bg-slate-950/50 p-3 sm:p-6" role="dialog" aria-modal="true" aria-labelledby="versions-modal-title" tabindex="-1" onclick="if (event.target === this) closeCreativeVersions()">
        <section class="flex max-h-[85vh] w-full max-w-4xl flex-col overflow-hidden rounded-2xl bg-white shadow-2xl">
            <header class="flex items-start justify-between gap-4 border-b border-slate-200 px-4 py-4 sm:px-6">
                <div class="min-w-0">
                    <p class="text-[10px] font-bold uppercase tracking-widest text-purple-500">Creative versions</p>
                    <h2 id="versions-modal-title" class="mt-1 break-words text-lg font-black text-slate-900 sm:text-xl"></h2>
                </div>
                <button id="versions-modal-close" type="button" aria-label="Close versions" title="Close" onclick="closeCreativeVersions()" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-purple-400">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </header>
            <div id="versions-modal-list" class="min-h-0 overflow-y-auto p-3 sm:p-6"></div>
        </section>
    </div>

    <button id="back-to-top" type="button" aria-label="Back to top" title="Back to top" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" class="fixed bottom-6 right-6 z-50 hidden h-11 w-11 items-center justify-center rounded-full bg-slate-900 text-white shadow-lg transition-colors hover:bg-slate-700 focus:outline-none focus:ring-4 focus:ring-slate-300">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <script>
        // Initialize today's date and advance it when the local day changes.
        const initialDateValue = getLocalDateValue();
        document.getElementById('start-date').value = initialDateValue;
        document.getElementById('end-date').value = initialDateValue;
        let lastAutoDateValue = initialDateValue;
        let dateRangeManuallyChanged = false;

        let globalData = [];
        let creativeVersionIndex = new Map();
        let creativeNameSuggestions = [];
        let creativeSuggestionsSuppressed = false;
        let expandedGroups = {}; // Keep track of which ETs are open so background sync doesn't close them
        let hasFetchedOnce = false; // Prevent loading screen from flashing repeatedly if data is empty
        let isFetchingData = false;
        const GLOBAL_SEARCH_PAGE_SIZE = 200;
        let globalSearchLimit = GLOBAL_SEARCH_PAGE_SIZE;
        let selectedCreativeVersion = '';
        let lastCreativeStates = null;
        const queuedPendingNotifications = new Map();
        const queuedCompletedETs = new Set();
        const AUTO_SYNC_INTERVAL_MS = 5000;

                function updateNotificationButton() {
            const button = document.getElementById('notification-btn');
            const buttonText = document.getElementById('notification-btn-text');
            const icon = document.getElementById('notification-icon');
            if (!button || !buttonText || !icon) return;

            if (!('Notification' in window)) {
                buttonText.textContent = 'Alerts Unavailable';
                button.title = 'This browser does not support desktop notifications';
                button.disabled = true;
                button.classList.add('cursor-not-allowed', 'opacity-60');
                return;
            }

            if (!window.isSecureContext) {
                buttonText.textContent = 'Use HTTPS';
                button.title = 'Desktop notifications require HTTPS or localhost';
                button.disabled = true;
                button.classList.add('cursor-not-allowed', 'opacity-60');
                return;
            }

            if (Notification.permission === 'granted') {
                button.disabled = false;
                button.classList.remove('cursor-default', 'cursor-not-allowed');
                
                if (localStorage.getItem('appAlertsEnabled') === 'false') {
                    buttonText.textContent = 'Alerts Off';
                    button.title = 'Click to enable desktop notifications';
                    icon.className = 'fa-solid fa-bell-slash text-slate-500';
                    button.className = 'inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold tracking-wide transition-all border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 active:scale-95';
                } else {
                    buttonText.textContent = 'Alerts On';
                    button.title = 'Click to turn off desktop notifications';
                    icon.className = 'fa-solid fa-bell';
                    button.className = 'inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold tracking-wide transition-all border border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 active:scale-95';
                    flushQueuedNotifications();
                }
            } else if (Notification.permission === 'denied') {
                buttonText.textContent = 'Allow in Browser';
                button.title = 'Notifications are blocked. Allow them in this site\'s browser settings.';
                button.disabled = true;
                icon.className = 'fa-solid fa-bell-slash';
                button.classList.add('cursor-not-allowed');
            } else {
                buttonText.textContent = 'Enable Alerts';
                button.title = 'Enable desktop notifications';
                button.disabled = false;
            }
        }

                async function enableDesktopNotifications() {
            const buttonText = document.getElementById('notification-btn-text');
            if (!('Notification' in window)) {
                updateNotificationButton();
                return;
            }
            if (!window.isSecureContext) {
                updateNotificationButton();
                return;
            }
            if (Notification.permission === 'denied') {
                updateNotificationButton();
                return;
            }

            if (Notification.permission === 'granted') {
                if (localStorage.getItem('appAlertsEnabled') === 'false') {
                    localStorage.setItem('appAlertsEnabled', 'true');
                    updateNotificationButton();
                    showDesktopNotification(
                        'Alerts Enabled',
                        'You will now receive desktop notifications.',
                        'creative-uploadings-enabled'
                    );
                } else {
                    if (confirm('Are you sure you want to turn off desktop notifications?')) {
                        localStorage.setItem('appAlertsEnabled', 'false');
                        updateNotificationButton();
                    }
                }
                return;
            }

            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    localStorage.setItem('appAlertsEnabled', 'true');
                    updateNotificationButton();
                    showDesktopNotification(
                        'Creative Uploadings Alerts Enabled',
                        'You will be notified about new pending creatives and ETs completed.',
                        'creative-uploadings-enabled'
                    );
                } else if (buttonText) {
                    buttonText.textContent = 'Permission Needed';
                }
                updateNotificationButton();
            } catch (error) {
                console.error('Could not enable desktop notifications:', error);
                if (buttonText) buttonText.textContent = 'Enable Failed';
            }
        }

        function showDesktopNotification(title, body, tag) {
            const notification = new Notification(title, {
                body,
                tag,
                icon: 'logo.png',
                requireInteraction: true
            });
            notification.onclick = () => window.focus();
        }

                
        function showCreativeUpdateNotification(newData) {
            if (!('Notification' in window)) return;

            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const notificationData = newData.filter(item => {
                const itemDate = item.filter_date;
                return (!startDate || itemDate >= startDate) && (!endDate || itemDate <= endDate);
            });

            const currentTabMap = new Map();
            for (const item of notificationData) {
                if (!currentTabMap.has(item.tab)) currentTabMap.set(item.tab, []);
                currentTabMap.get(item.tab).push(item);
            }

            if (!window.lastNotificationDataMap) {
                window.lastNotificationDataMap = currentTabMap;
                return;
            }

            const newlyAddedByTab = new Map();
            const uncompletedByTab = new Map();
            const completedTabs = [];

            for (const [tab, currentItems] of currentTabMap) {
                const previousItems = window.lastNotificationDataMap.get(tab) || [];
                
                const currentCounts = {};
                const currentDoneCounts = {};
                for (const item of currentItems) {
                    currentCounts[item.et] = (currentCounts[item.et] || 0) + 1;
                    if (item.is_done) currentDoneCounts[item.et] = (currentDoneCounts[item.et] || 0) + 1;
                }

                const previousCounts = {};
                const previousDoneCounts = {};
                for (const item of previousItems) {
                    previousCounts[item.et] = (previousCounts[item.et] || 0) + 1;
                    if (item.is_done) previousDoneCounts[item.et] = (previousDoneCounts[item.et] || 0) + 1;
                }

                for (const [name, count] of Object.entries(currentCounts)) {
                    const prevCount = previousCounts[name] || 0;
                    if (count > prevCount) {
                        const addedCount = count - prevCount;
                        if (!newlyAddedByTab.has(tab)) newlyAddedByTab.set(tab, []);
                        for (let i = 0; i < addedCount; i++) newlyAddedByTab.get(tab).push(name);
                    }
                    
                    const prevDone = previousDoneCounts[name] || 0;
                    const currDone = currentDoneCounts[name] || 0;
                    if (currDone < prevDone) {
                        const undoneCount = prevDone - currDone;
                        if (!uncompletedByTab.has(tab)) uncompletedByTab.set(tab, []);
                        for (let i = 0; i < undoneCount; i++) uncompletedByTab.get(tab).push(name);
                    }
                }

                const prevPending = previousItems.some(item => !item.is_done);
                const currPending = currentItems.some(item => !item.is_done);
                const currHasItems = currentItems.length > 0;
                if (prevPending && !currPending && currHasItems) {
                    completedTabs.push(tab);
                }
            }

            window.lastNotificationDataMap = currentTabMap;
            
            flushQueuedNotifications(completedTabs, newlyAddedByTab, uncompletedByTab);
        }

        function flushQueuedNotifications(completedTabs = [], newlyAddedByTab = new Map(), uncompletedByTab = new Map()) {
            if (!('Notification' in window) || Notification.permission !== 'granted' || localStorage.getItem('appAlertsEnabled') === 'false') return;

            // Helper to count and format creative names
            const formatCreativeCounts = (creatives) => {
                const counts = {};
                for (const c of creatives) counts[c] = (counts[c] || 0) + 1;
                return Object.entries(counts).map(([name, count]) => count > 1 ? `${name} ( ${count} )` : name).join(', ');
            };

            // 1. Grouped Added Creatives
            for (const [tab, creatives] of newlyAddedByTab) {
                const formattedList = formatCreativeCounts(creatives);
                
                showDesktopNotification(
                    `✨ New Creative(s) Added`,
                    `ET: ${tab}\nPending creative: ${formattedList}`,
                    `creative-added-${encodeURIComponent(tab)}-${Date.now()}`
                );
            }

            // 2. Uncompleted (Done status removed)
            for (const [tab, creatives] of uncompletedByTab) {
                const formattedList = formatCreativeCounts(creatives);
                showDesktopNotification(
                    `⚠️ DONE Status Removed`,
                    `ET: ${tab}\nCreative(s): ${formattedList}`,
                    `creative-undone-${encodeURIComponent(tab)}-${Date.now()}`
                );
            }

            // 3. Completed Tabs (Fully done)
            for (const tab of completedTabs) {
                showDesktopNotification(
                    `✅ Completed ET: ${tab}`,
                    `All creatives are done.`,
                    `creative-uploadings-done-${encodeURIComponent(tab)}-${Date.now()}`
                );
            }
        }

        const backToTopButton = document.getElementById('back-to-top');
        window.addEventListener('scroll', () => {
            backToTopButton.classList.toggle('hidden', window.scrollY < 300);
        }, { passive: true });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeCreativeVersions();
        });
        document.addEventListener('click', event => {
            if (!event.target.closest('#global-creative-finder')) closeCreativeSuggestions();
        });
        updateNotificationButton();
        window.addEventListener('focus', updateNotificationButton);
        window.addEventListener('focus', () => {
            updateDateRangeForNewDay();
            if (!document.hidden && !isFetchingData) fetchData();
        });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                updateDateRangeForNewDay();
                if (!isFetchingData) fetchData();
            }
        });

        function getLocalDateValue(date = new Date()) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function handleDateRangeChange() {
            const today = getLocalDateValue();
            dateRangeManuallyChanged = document.getElementById('start-date').value !== today || document.getElementById('end-date').value !== today;
            renderTable();
        }

        function updateDateRangeForNewDay(today = getLocalDateValue()) {
            if (today === lastAutoDateValue) return;

            const startDate = document.getElementById('start-date');
            const endDate = document.getElementById('end-date');
            const shouldAdvance = !dateRangeManuallyChanged && startDate.value === lastAutoDateValue && endDate.value === lastAutoDateValue;
            lastAutoDateValue = today;

            if (shouldAdvance) {
                startDate.value = today;
                endDate.value = today;
                renderTable();
            }
        }

        setInterval(updateDateRangeForNewDay, 60000);

        function getCreativeVersionKey(name) {
            return name.trim().replace(/(?:[_\\s-]+)(?:IMG|ORG)$/i, '').replace(/[\\s-]+/g, '_').toUpperCase();
        }

        function getCreativeVersionType(name, baseName) {
            if (/_[-a-z0-9]+(?:\.[-a-z0-9]+)+$/i.test(name.trim())) return 'Domains';
            const suffix = name.trim().slice(baseName.length).replace(/^[_\s-]+/, '');
            const tokens = suffix.split(/[_\s-]+/).filter(Boolean);
            return tokens.length ? tokens[tokens.length - 1].toUpperCase() : 'CRT_Name';
        }

        function rebuildCreativeVersionIndex() {
            creativeVersionIndex = new Map();
            const creativeNames = new Set();
            for (const item of globalData) {
                const key = getCreativeVersionKey(item.et);
                creativeNames.add(item.et.trim());
                let family = creativeVersionIndex.get(key);
                if (!family) {
                    family = { items: [], creativeNames: new Set() };
                    creativeVersionIndex.set(key, family);
                }
                family.items.push(item);
                family.creativeNames.add(item.et.trim());
            }
            creativeNameSuggestions = [...creativeNames].sort((a, b) => a.localeCompare(b));
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function closeCreativeSuggestions() {
            const panel = document.getElementById('creative-suggestions-panel');
            panel.classList.add('hidden');
            document.getElementById('creative-finder').setAttribute('aria-expanded', 'false');
        }

        function renderCreativeSuggestions(query) {
            const panel = document.getElementById('creative-suggestions-panel');
            const finder = document.getElementById('creative-finder');
            if (creativeSuggestionsSuppressed || query.length < 2) {
                closeCreativeSuggestions();
                return;
            }

            const suggestions = creativeNameSuggestions
                .filter(name => name.toLowerCase().includes(query))
                .slice(0, 8);
            if (suggestions.length === 0) {
                closeCreativeSuggestions();
                return;
            }

            panel.innerHTML = suggestions.map(name => `<button type="button" role="option" aria-selected="false" onmousedown="event.preventDefault()" onclick="selectCreativeSuggestion('${btoa(unescape(encodeURIComponent(name)))}')" class="block w-full truncate px-3 py-2 text-left text-xs font-medium text-slate-700 hover:bg-purple-50 hover:text-purple-900 focus:bg-purple-50 focus:outline-none">${escapeHtml(name)}</button>`).join('');
            panel.classList.remove('hidden');
            finder.setAttribute('aria-expanded', 'true');
        }

        function selectCreativeSuggestion(encodedName) {
            document.getElementById('creative-finder').value = decodeURIComponent(escape(atob(encodedName)));
            creativeSuggestionsSuppressed = true;
            selectedCreativeVersion = '';
            globalSearchLimit = GLOBAL_SEARCH_PAGE_SIZE;
            closeCreativeSuggestions();
            renderTable();
        }

        function openCreativeVersions(encodedName) {
            const selectedName = decodeURIComponent(escape(atob(encodedName)));
            const family = creativeVersionIndex.get(getCreativeVersionKey(selectedName));
            if (!family || family.creativeNames.size < 2) return;

            const title = selectedName.replace(/(?:[_\\s-]+)(?:IMG|ORG)$/i, '');
            document.getElementById('versions-modal-title').textContent = title;
            const sortedVersions = [...family.items].sort((a, b) => a.et.localeCompare(b.et) || a.tab.localeCompare(b.tab));
            document.getElementById('versions-modal-list').innerHTML = sortedVersions.map(item => {
                const version = item.et.match(/(?:[_\\s-]+)(IMG|ORG)$/i)?.[1]?.toUpperCase() || 'BASE';
                const statusClass = item.is_done ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700';
                return `<div class="grid grid-cols-1 gap-2 border-b border-slate-100 px-2 py-3 last:border-0 sm:grid-cols-[minmax(0,1fr)_auto_auto_auto_auto] sm:items-center sm:gap-4 sm:px-3">
                    <span class="min-w-0 break-all font-semibold text-slate-800">${escapeHtml(item.et)}</span>
                    <span class="w-fit rounded-md bg-purple-50 px-2 py-1 text-[10px] font-bold uppercase text-purple-700">${version}</span>
                    <span class="text-sm text-slate-600">${escapeHtml(item.tab)}</span>
                    <span class="text-sm text-slate-500">${escapeHtml(item.date)}</span>
                    <span class="w-fit rounded-full px-2.5 py-1 text-[10px] font-bold uppercase ${statusClass}">${escapeHtml(item.status || 'PENDING')}</span>
                </div>`;
            }).join('');

            const modal = document.getElementById('versions-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('versions-modal-close').focus();
        }

        function closeCreativeVersions() {
            const modal = document.getElementById('versions-modal');
            if (!modal.classList.contains('hidden')) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function renderCreativeVersionFilters(query) {
            const container = document.getElementById('creative-version-filters');
            const normalizedQuery = query.trim().toLowerCase().replace(/[_-]+$/, '');
            const matchingNames = normalizedQuery
                ? [...new Set(globalData.map(item => item.et.trim()).filter(name => {
                    const normalizedName = name.toLowerCase();
                    return normalizedName === normalizedQuery || normalizedName.startsWith(`${normalizedQuery}_`);
                }))].sort((a, b) => a.localeCompare(b))
                : [];
            const versionTypes = [...new Set(matchingNames.map(name => getCreativeVersionType(name, normalizedQuery)))];
            versionTypes.sort((a, b) => a === 'CRT_Name' ? -1 : b === 'CRT_Name' ? 1 : a.localeCompare(b));

            if (versionTypes.length < 2 || versionTypes.length > 40) {
                selectedCreativeVersion = '';
                container.innerHTML = '';
                container.classList.add('hidden');
                return;
            }

            if (!versionTypes.includes(selectedCreativeVersion)) selectedCreativeVersion = '';

            const buttonClass = version => selectedCreativeVersion === version
                ? 'bg-purple-700 text-white border-purple-700'
                : 'bg-white text-purple-800 border-purple-200 hover:bg-purple-100';
            container.innerHTML = `<button type="button" aria-pressed="${selectedCreativeVersion === ''}" onclick="selectCreativeVersion('')" class="rounded-md border px-2 py-1 text-[10px] font-bold ${buttonClass('')}">All Versions</button>` +
                versionTypes.map(version => `<button type="button" aria-pressed="${selectedCreativeVersion === version}" onclick="selectCreativeVersion('${btoa(unescape(encodeURIComponent(version)))}')" class="max-w-full break-all rounded-md border px-2 py-1 text-[10px] font-bold ${buttonClass(version)}">${escapeHtml(version)}</button>`).join('');
            container.classList.remove('hidden');
        }

        function selectCreativeVersion(encodedName) {
            selectedCreativeVersion = encodedName ? decodeURIComponent(escape(atob(encodedName))) : '';
            globalSearchLimit = GLOBAL_SEARCH_PAGE_SIZE;
            renderTable();
        }

        async function fetchData() {
            if (isFetchingData) return;
            isFetchingData = true;

            const btn = document.getElementById('sync-btn');
            const syncIcon = document.getElementById('sync-icon');
            const syncText = document.getElementById('sync-text');
            const statusBadge = document.getElementById('status-badge');
            const statusIcon = document.getElementById('status-icon');
            const statusText = document.getElementById('status-text');
            const tbody = document.getElementById('table-body');

            btn.disabled = true;
            syncIcon.className = "fa-solid fa-circle-notch fa-spin";
            syncText.textContent = "Syncing...";

            try {
                // Fetch all data regardless of date so we can filter instantly on the frontend
                const response = await fetch(`/api/sync`);
                const result = await response.json();
                
                if (!result.success) throw new Error(result.error);
                
                const newData = result.data;
                const isDataChanged = JSON.stringify(globalData) !== JSON.stringify(newData);
                if (isDataChanged) {
                    globalData = newData;
                    rebuildCreativeVersionIndex();
                    showCreativeUpdateNotification(newData);
                }
                hasFetchedOnce = true;
                
                // Generate datalists for autocomplete
                const uniqueTabs = [...new Set(globalData.map(item => item.tab))].sort();
                const etDatalist = document.getElementById('et-suggestions');
                if (etDatalist) etDatalist.innerHTML = uniqueTabs.map(t => `<option value="${t.replace(/"/g, '&quot;')}"></option>`).join('');

                statusBadge.className = 'flex items-center gap-2 bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-lg text-xs font-bold tracking-wide border border-emerald-100';
                statusIcon.className = 'fa-solid fa-circle-check text-emerald-500';
                
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour12: true });
                statusText.textContent = `Last sync: ${timeString}`;

                const tbodyContent = tbody.innerHTML;
                if (isDataChanged || tbodyContent.includes('An error occurred') || tbodyContent.includes('Ready to fetch')) {
                    renderTable();
                }

            } catch (error) {
                console.error("Sync error:", error);
                statusBadge.className = 'flex items-center gap-2 bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold tracking-wide border border-red-100';
                statusIcon.className = 'fa-solid fa-triangle-exclamation text-red-500';
                statusText.textContent = `Sync Failed: ${error.message}`;
                
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="py-32 text-center text-red-500">
                            <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-red-50 mb-6 shadow-inner border border-red-100">
                                <i class="fa-solid fa-circle-exclamation text-3xl text-red-400"></i>
                            </div>
                            <h3 class="text-xl font-bold tracking-tight text-slate-700">An error occurred</h3>
                            <p class="text-sm mt-2 text-slate-500 font-medium max-w-lg mx-auto leading-relaxed">${error.message}</p>
                        </td>
                    </tr>
                `;
            } finally {
                btn.disabled = false;
                syncIcon.className = "fa-solid fa-bolt";
                syncText.textContent = "Sync Now";
                isFetchingData = false;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const searchEtVal = document.getElementById('search-et').value.toLowerCase().trim();
            const creativeFinderVal = document.getElementById('creative-finder').value.toLowerCase().trim();
            renderCreativeSuggestions(creativeFinderVal);
            renderCreativeVersionFilters(creativeFinderVal);
            const finderResults = document.getElementById('creative-finder-results');
            const suggestionsPanel = document.getElementById('creative-suggestions-panel');
            const versionFilters = document.getElementById('creative-version-filters');
            finderResults.classList.toggle('hidden', suggestionsPanel.classList.contains('hidden') && versionFilters.classList.contains('hidden'));
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const applyFinderDateRange = document.getElementById('creative-finder-date-range').checked;
            
            // Filter
            let filteredData = globalData;
            
            if (creativeFinderVal) {
                filteredData = globalData.filter(item => 
                    item.tab.toLowerCase().includes(creativeFinderVal) || 
                    item.et.toLowerCase().includes(creativeFinderVal)
                );
                if (applyFinderDateRange) {
                    filteredData = filteredData.filter(item => {
                        const rDate = item.filter_date;
                        return (!startDate || rDate >= startDate) && (!endDate || rDate <= endDate);
                    });
                    filteredData.sort((a, b) => a.filter_date.localeCompare(b.filter_date));
                }
                if (selectedCreativeVersion) {
                    const baseName = creativeFinderVal.trim().replace(/[_-]+$/, '');
                    filteredData = filteredData.filter(item => selectedCreativeVersion === 'Domains'
                        ? /_[-a-z0-9]+(?:\.[-a-z0-9]+)+$/i.test(item.et.trim())
                        : getCreativeVersionType(item.et, baseName) === selectedCreativeVersion);
                }
            } else {
                // DATE VIEW: Normal date filtering
                filteredData = globalData.filter(item => {
                    const rDate = item.filter_date;
                    let inRange = true;
                    if (startDate && rDate < startDate) inRange = false;
                    if (endDate && rDate > endDate) inRange = false;
                    return inRange;
                });
                
                // If they also used the ET filter within the date view
                if (searchEtVal) {
                    filteredData = filteredData.filter(item => 
                        item.tab.toLowerCase().includes(searchEtVal)
                    );
                }
            }

            const isGlobalSearch = creativeFinderVal !== "";
            const searchSummary = document.getElementById('global-search-summary');
            if (isGlobalSearch && filteredData.length > globalSearchLimit) {
                const shownCount = Math.min(globalSearchLimit, filteredData.length);
                const nextCount = Math.min(GLOBAL_SEARCH_PAGE_SIZE, filteredData.length - shownCount);
                searchSummary.style.display = 'flex';
                document.getElementById('global-search-count').textContent = `Showing ${shownCount.toLocaleString()} of ${filteredData.length.toLocaleString()} matching creatives`;
                document.getElementById('global-search-more').textContent = `Show next ${nextCount.toLocaleString()}`;
            } else {
                searchSummary.style.display = 'none';
            }
            
            // Update Counts
            const doneItems = filteredData.filter(i => i.is_done);
            const pendingItems = filteredData.filter(i => !i.is_done);
            document.getElementById('count-done').textContent = doneItems.length;
            document.getElementById('count-pending').textContent = pendingItems.length;

            if (filteredData.length === 0) {
                document.getElementById('pending-et-container').classList.add('hidden');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="py-32 text-center text-slate-400">
                            <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-slate-50 mb-6 shadow-inner border border-slate-100">
                                <i class="fa-solid fa-folder-open text-3xl text-slate-300"></i>
                            </div>
                            <h3 class="text-xl font-bold tracking-tight text-slate-700">No creatives found</h3>
                            <p class="text-sm mt-2 text-slate-500 font-medium">Try searching for a different date or ET name.</p>
                        </td>
                    </tr>
                `;
                return;
            }

            // Group data by ET Name (Tab)
            const groupedByET = {};
            filteredData.forEach(item => {
                if (!groupedByET[item.tab]) {
                    groupedByET[item.tab] = { total: 0, done: 0, pending: 0, items: [] };
                }
                groupedByET[item.tab].items.push(item);
                groupedByET[item.tab].total++;
                if (item.is_done) groupedByET[item.tab].done++;
                else groupedByET[item.tab].pending++;
            });

            // Sort ET Names alphabetically
            const sortedETs = Object.keys(groupedByET).sort((a, b) => a.localeCompare(b));

            for (const etName of sortedETs) {
                const group = groupedByET[etName];
                group.items.sort((a, b) => applyFinderDateRange && isGlobalSearch
                    ? a.filter_date.localeCompare(b.filter_date) || a.et.localeCompare(b.et)
                    : a.et.localeCompare(b.et));
                group.visibleItems = isGlobalSearch ? [] : group.items;
            }

            if (isGlobalSearch) {
                let remaining = Math.min(globalSearchLimit, filteredData.length);
                let itemIndex = 0;
                while (remaining > 0) {
                    let addedAtThisIndex = false;
                    for (const etName of sortedETs) {
                        if (remaining === 0) break;
                        const item = groupedByET[etName].items[itemIndex];
                        if (item) {
                            groupedByET[etName].visibleItems.push(item);
                            remaining--;
                            addedAtThisIndex = true;
                        }
                    }
                    if (!addedAtThisIndex) break;
                    itemIndex++;
                }
            }

            // Populate the "ETs Needing Work" list on the Pending Card
            const pendingETNames = sortedETs.filter(et => groupedByET[et].pending > 0);
            const pendingContainer = document.getElementById('pending-et-container');
            const pendingList = document.getElementById('pending-et-list');
            
            if (pendingETNames.length > 0) {
                pendingContainer.classList.remove('hidden');
                pendingList.innerHTML = pendingETNames.map(et => 
                    `<span class="bg-amber-50 border border-amber-200 text-amber-700 px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider shadow-sm flex items-center gap-1.5 cursor-pointer hover:bg-amber-100 transition-colors" onclick="openETGroup('et-${btoa(unescape(encodeURIComponent(et))).replace(/[^a-zA-Z0-9]/g, '')}', '${et.replace(/'/g, "\\'")}')">
                        <i class="fa-solid fa-folder-open text-amber-500"></i> ${et}
                    </span>`
                ).join('');
            } else {
                pendingContainer.classList.add('hidden');
                pendingList.innerHTML = '';
            }

            // Populate the "Completed ETs" list on the Done Card
            const doneETNames = sortedETs.filter(et => groupedByET[et].pending === 0 && groupedByET[et].done > 0);
            const doneContainer = document.getElementById('done-et-container');
            const doneList = document.getElementById('done-et-list');
            
            if (doneETNames.length > 0) {
                doneContainer.classList.remove('hidden');
                doneList.innerHTML = doneETNames.map(et => 
                    `<span class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider shadow-sm flex items-center gap-1.5 cursor-pointer hover:bg-emerald-100 transition-colors" onclick="openETGroup('et-${btoa(unescape(encodeURIComponent(et))).replace(/[^a-zA-Z0-9]/g, '')}', '${et.replace(/'/g, "\\'")}')">
                        <i class="fa-solid fa-check-circle text-emerald-500"></i> ${et}
                    </span>`
                ).join('');
            } else {
                doneContainer.classList.add('hidden');
                doneList.innerHTML = '';
            }

            let html = "";
            for (const etName of sortedETs) {
                const group = groupedByET[etName];
                
                // Create a safe, unique ID for this ET based on its name (handles spaces and brackets)
                const safeId = "et-" + btoa(unescape(encodeURIComponent(etName))).replace(/[^a-zA-Z0-9]/g, '');
                const isExpanded = (expandedGroups[etName] === true) || (searchEtVal !== "") || (creativeFinderVal !== "");
                const rowClass = isExpanded ? "" : "hidden";
                const iconClass = isExpanded ? "rotate-90" : "";
                
                // Group Header Row (Clickable)
                html += `
                    <tr id="header-${safeId}" class="bg-blue-50/60 border-y border-blue-100/50 cursor-pointer hover:bg-blue-100 transition-colors" onclick="toggleGroup('${safeId}', '${etName.replace(/'/g, "\\'")}')">
                        <td colspan="4" class="py-3 px-8">
                            <div class="flex items-center justify-between">
                                <div class="font-black text-blue-900 text-sm tracking-wide uppercase flex items-center">
                                    <i id="icon-${safeId}" class="fa-solid fa-chevron-right text-blue-500 mr-3 transition-transform duration-200 ${iconClass}"></i>
                                    <i class="fa-solid fa-folder-open text-blue-500 mr-2"></i> ${etName}
                                </div>
                                <div class="flex items-center gap-6 text-xs font-bold uppercase tracking-wider bg-white px-4 py-1.5 rounded-lg shadow-sm border border-blue-100/50">
                                    <span class="text-slate-500">Total: ${group.total}</span>
                                    <div class="w-px h-3 bg-slate-200"></div>
                                    <span class="text-emerald-600"><i class="fa-solid fa-check mr-1"></i> Done: ${group.done}</span>
                                    <div class="w-px h-3 bg-slate-200"></div>
                                    <span class="text-amber-600"><i class="fa-solid fa-clock mr-1"></i> Pending: ${group.pending}</span>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;

                // Creative Rows for this ET
                html += group.visibleItems.map(item => `
                    <tr class="group hover:bg-slate-50/70 transition-colors ${item.is_done ? 'bg-emerald-50/10 hover:bg-emerald-50/40' : ''} ${safeId} ${rowClass}">
                        <td class="py-4 px-8 pl-14 border-l-2 border-transparent group-hover:border-blue-400">
                            <i class="fa-solid fa-turn-up fa-rotate-90 text-slate-300 mr-2"></i>
                            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Creative</span>
                        </td>
                        <td class="py-4 px-8">
                            <div class="flex min-w-0 flex-wrap items-center gap-2">
                                <span class="break-all font-bold text-slate-700 text-[14px]">${item.et}</span>
                            </div>
                        </td>
                        <td class="py-4 px-8">
                            <div class="flex flex-col gap-1">
                                <span class="inline-flex items-center text-slate-500 font-medium text-sm">
                                    <i class="fa-regular fa-calendar text-slate-400 mr-2"></i> ${item.date}
                                </span>
                                <span class="inline-flex items-center text-[10px] text-slate-400 font-bold uppercase tracking-widest" title="Automatically tracked when first seen">
                                    <i class="fa-solid fa-clock-rotate-left mr-1.5 opacity-70"></i> Added: ${item.discovered_at}
                                </span>
                            </div>
                        </td>
                        <td class="py-4 px-8 text-right">
                            ${item.is_done 
                                ? `<span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider shadow-sm"><i class="fa-solid fa-check"></i> Done</span>`
                                : `<span class="inline-flex items-center gap-1.5 bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider shadow-sm"><i class="fa-solid fa-circle-notch fa-spin text-amber-500"></i> ${item.status || "PENDING"}</span>`
                            }
                        </td>
                    </tr>
                `).join('');
            }
            
            tbody.innerHTML = html;
        }

        function handleCreativeFinderInput() {
            creativeSuggestionsSuppressed = false;
            selectedCreativeVersion = '';
            globalSearchLimit = GLOBAL_SEARCH_PAGE_SIZE;
            renderTable();
        }

        function showMoreGlobalSearchResults() {
            globalSearchLimit += GLOBAL_SEARCH_PAGE_SIZE;
            renderTable();
        }

        // Toggles visibility of items within an ET group
        function toggleGroup(safeId, etName) {
            const rows = document.querySelectorAll('.' + safeId);
            const icon = document.getElementById('icon-' + safeId);
            
            if (rows.length === 0) return;

            const isCurrentlyHidden = rows[0].classList.contains('hidden');
            
            if (isCurrentlyHidden) {
                // Expand
                rows.forEach(r => r.classList.remove('hidden'));
                icon.classList.add('rotate-90');
                expandedGroups[etName] = true;
            } else {
                // Collapse
                rows.forEach(r => r.classList.add('hidden'));
                icon.classList.remove('rotate-90');
                expandedGroups[etName] = false;
            }
        }

        function openETGroup(safeId, etName) {
            const rows = document.querySelectorAll('.' + safeId);
            if (rows.length === 0) return;

            if (rows[0].classList.contains('hidden')) {
                toggleGroup(safeId, etName);
            }
            const groupHeader = document.getElementById('header-' + safeId);
            if (groupHeader) {
                const stickyHeader = document.querySelector('header');
                const top = groupHeader.getBoundingClientRect().top + window.scrollY - (stickyHeader?.offsetHeight || 0) - 12;
                window.scrollTo({ top, behavior: 'smooth' });
            }
        }

        setInterval(() => {
            if (!isFetchingData) fetchData();
        }, AUTO_SYNC_INTERVAL_MS);
        setTimeout(() => {
            if (!isFetchingData) fetchData();
        }, 100);
    </script>
</body>
</html>
